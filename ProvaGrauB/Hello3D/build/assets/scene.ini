# =====================================================
# Cena Diorama - Quarteirão Urbano
# Hiago Pansera - Computacao Grafica - Unisinos 2025
# =====================================================
# Conceito: diorama estilo NY – plataforma elevada com
# tres predios de alturas distintas, uma rua central
# e dois veiculos animados percorrendo trajetorias
# de Bezier cubica.
#
# scale_xyz: escala nao-uniforme fixa (forma do objeto)
#            o usuario ainda controla escala uniforme
#            interativa por cima com as teclas [ e ]
# =====================================================

[camera]
position = 2.0 9.0 18.0
yaw      = -90.0
pitch    = -22.0
fov      = 45.0
near     = 0.1
far      = 150.0

# --- Key Light: frente-esquerda elevada, branco quente ---
[light]
name     = Key Light
position = -5.0 8.0 7.0
color    = 3.5 3.2 2.7
enabled  = 1

# --- Fill Light: frente-direita suave, azul frio ---
[light]
name     = Fill Light
position = 7.0 5.0 6.0
color    = 1.4 1.5 2.0
enabled  = 1

# --- Back Light: atras elevada, branco frio (rim) ---
[light]
name     = Back Light
position = 0.0 8.0 -8.0
color    = 2.0 2.1 2.8
enabled  = 1

# ----- PLATAFORMA BASE -----
# Cubo achatado (16 x 0.6 x 16) centrado em Y=-0.3
[object]
name      = Plataforma
file      = assets/platform.obj
position  = 0.0 -0.3 0.0
rotation  = 0.0 0.0 0.0
scale     = 1.0
scale_xyz = 16.0 0.6 16.0

# ----- PREDIO A – arranha-ceu azul-cinza -----
# fixedScale (3 x 9 x 3) -> Y offset = 9/2 = 4.5
[object]
name      = Predio_A
file      = assets/building_a.obj
position  = -5.0 4.5 -5.0
rotation  = 0.0 0.0 0.0
scale     = 1.0
scale_xyz = 3.0 9.0 3.0

# ----- PREDIO B – edificio medio bege -----
# fixedScale (2.5 x 6 x 2.5) -> Y offset = 3.0
[object]
name      = Predio_B
file      = assets/building_b.obj
position  = 5.0 3.0 -5.0
rotation  = 0.0 15.0 0.0
scale     = 1.0
scale_xyz = 2.5 6.0 2.5

# ----- PREDIO C – edificio tijolo -----
# fixedScale (2 x 4 x 2) -> Y offset = 2.0
[object]
name      = Predio_C
file      = assets/building_c.obj
position  = -5.0 2.0 5.0
rotation  = 0.0 -10.0 0.0
scale     = 1.0
scale_xyz = 2.0 4.0 2.0

# ----- RUA CENTRAL -----
# Faixa escura que corta a plataforma (16 x 0.05 x 3.5)
[object]
name      = Rua
file      = assets/road.obj
position  = 0.0 0.025 0.0
rotation  = 0.0 0.0 0.0
scale     = 1.0
scale_xyz = 16.0 0.05 3.5

# ----- VEICULO A – taxi amarelo (animado) -----
# Percorre Bezier cubica ao longo da rua (sentido +X → -X)
[object]
name          = Veiculo_A
file          = assets/vehicle_a.obj
position      = 0.0 0.22 0.8
rotation      = 0.0 0.0 0.0
scale         = 1.0
scale_xyz     = 1.2 0.45 0.7
bezier_speed  = 0.55
bezier_points = -6.5 0.22 0.8 / -3.0 0.22 1.5 / 3.0 0.22 1.5 / 6.5 0.22 0.8

# ----- VEICULO B – carro vermelho (animado) -----
# Percorre Bezier cubica em sentido oposto (-X → +X)
[object]
name          = Veiculo_B
file          = assets/vehicle_b.obj
position      = 0.0 0.22 -0.8
rotation      = 0.0 180.0 0.0
scale         = 1.0
scale_xyz     = 1.0 0.40 0.65
bezier_speed  = 0.40
bezier_points = 6.0 0.22 -0.8 / 3.0 0.22 -1.4 / -3.0 0.22 -1.4 / -6.0 0.22 -0.8
